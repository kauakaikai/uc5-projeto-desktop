<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetCare - Clinica Veterinaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="cabecalho">
        <h1>🐾 PetCare</h1>
        <p>Sua clínica com carinho de verdade</p>
      </header>

      <nav id="nav" class="nav">
        <button type="button" data-aba="clientes">🧑‍🤝‍🧑 Tutores</button>
        <button type="button" data-aba="pets">🐶 Pets</button>
        <button type="button" data-aba="consultas">📋 Consultas</button>
        <button type="button" data-aba="busca">🔍 Buscar</button>
      </nav>

      <main>
        <section id="secao-clientes" class="secao-aba"></section>
        <section id="secao-pets" class="secao-aba"></section>
        <section id="secao-consultas" class="secao-aba"></section>

        <section id="secao-busca" class="secao-aba painel">
          <h2>Buscar pet por nome do pet ou do tutor</h2>

          <form id="form-busca" class="formulario formulario-linha">
            <label for="busca-termo">Termo de busca (nome do pet ou do tutor)</label>
            <input type="text" id="busca-termo" name="termo" placeholder="Ex: Rex" autocomplete="off" />
            <button type="submit">Buscar</button>
          </form>
          <p id="erro-busca" class="status-erro" role="alert"></p>

          <div class="filtro-cliente">
            <label for="filtro-especie">Filtrar resultados por espécie (sem consultar o banco de novo)</label>
            <input type="text" id="filtro-especie" placeholder="cachorro, gato..." disabled autocomplete="off" />
          </div>

          <p id="status-busca" class="status"></p>
          <ul id="lista-resultados-busca" class="lista-busca"></ul>
        </section>
      </main>

      <p id="status" class="status"></p>
    </div>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
